<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 CS:GO Tactical Analyzer - Purple Strike</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Exo+2:wght@300;400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Exo 2', sans-serif;
            background: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120, 119, 198, 0.1) 0%, transparent 50%),
                linear-gradient(135deg, #0f0f23 0%, #1a1a2e 25%, #16213e 50%, #1a1a2e 75%, #0f0f23 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Grid cyberpunk de fondo */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(120, 119, 198, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(120, 119, 198, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            animation: grid-move 20s linear infinite;
        }

        @keyframes grid-move {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Efecto de escaneo */
        body::after {
            content: '';
            position: fixed;
            top: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #8b5cf6, #a855f7, #8b5cf6, transparent);
            animation: scan-line 3s ease-in-out infinite;
            z-index: 10;
        }

        @keyframes scan-line {
            0%, 100% { transform: translateY(0); opacity: 0; }
            50% { transform: translateY(100vh); opacity: 1; }
        }

        .main-container {
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .tactical-interface {
            background: 
                linear-gradient(145deg, rgba(17, 24, 39, 0.95), rgba(31, 41, 55, 0.9)),
                radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.05) 0%, transparent 70%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 0;
            width: 100%;
            max-width: 900px;
            position: relative;
            clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
            box-shadow: 
                0 0 50px rgba(139, 92, 246, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Esquinas tácticas */
        .tactical-interface::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #8b5cf6 0%, #a855f7 50%, #c084fc 100%);
            animation: pulse-border 2s ease-in-out infinite;
        }

        @keyframes pulse-border {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .hud-corners {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px solid #8b5cf6;
        }

        .corner-tl { top: 10px; left: 10px; border-right: none; border-bottom: none; }
        .corner-tr { top: 10px; right: 10px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 10px; left: 10px; border-right: none; border-top: none; }
        .corner-br { bottom: 10px; right: 10px; border-left: none; border-top: none; }

        .interface-content {
            padding: 40px;
            position: relative;
        }

        /* Header táctico */
        .tactical-header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .mission-title {
            font-family: 'Play', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 8px;
            text-shadow: 
                0 0 20px rgba(139, 92, 246, 0.8),
                0 0 40px rgba(139, 92, 246, 0.4);
            animation: title-glow 3s ease-in-out infinite alternate;
        }

        @keyframes title-glow {
            0% { text-shadow: 0 0 20px rgba(139, 92, 246, 0.8), 0 0 40px rgba(139, 92, 246, 0.4); }
            100% { text-shadow: 0 0 30px rgba(139, 92, 246, 1), 0 0 60px rgba(139, 92, 246, 0.6); }
        }

        .mission-subtitle {
            color: #8b5cf6;
            font-size: 1.1rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* HUD Status */
        .hud-status {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(139, 92, 246, 0.3);
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        .status-item {
            text-align: center;
            font-family: 'Play', sans-serif;
            font-size: 0.9rem;
            color: #cccccc;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-value {
            color: #00ff88;
            font-weight: 700;
            margin-right: 8px;
        }

        .status-critical {
            color: #8b5cf6;
        }

        /* Formulario táctico */
        .tactical-form {
            display: grid;
            gap: 25px;
        }

        .input-group {
            position: relative;
        }

        .input-label {
            display: block;
            color: #e5e7eb;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            padding-left: 15px;
        }

        .input-label::before {
            content: '▶';
            color: #8b5cf6;
            margin-right: 10px;
            font-size: 0.8rem;
        }

        .tactical-input, .tactical-select {
            width: 100%;
            background: 
                linear-gradient(145deg, rgba(17, 24, 39, 0.8), rgba(31, 41, 55, 0.6));
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: #ffffff;
            padding: 15px 20px;
            font-size: 1rem;
            font-family: 'Exo 2', sans-serif;
            font-weight: 500;
            clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
            transition: all 0.3s ease;
            position: relative;
            appearance: none; /* Quitar estilo nativo */
            -webkit-appearance: none;
            -moz-appearance: none;
        }

        /* Flecha personalizada para select */
        .tactical-select {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6,9 12,15 18,9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 16px;
            padding-right: 45px;
        }

        /* Opciones del select */
        .tactical-select option {
            background: #1f2937;
            color: #ffffff;
            padding: 10px;
            border: none;
        }

        .tactical-select option:hover,
        .tactical-select option:checked {
            background: #8b5cf6;
            color: #ffffff;
        }

        .tactical-input:focus, .tactical-select:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 
                0 0 20px rgba(139, 92, 246, 0.4),
                inset 0 0 20px rgba(139, 92, 246, 0.1);
            background: 
                linear-gradient(145deg, rgba(17, 24, 39, 0.9), rgba(31, 41, 55, 0.7));
        }

        .tactical-input::placeholder {
            color: rgba(156, 163, 175, 0.7);
            font-style: italic;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* Botón de ejecución */
        .execute-btn {
            background: linear-gradient(145deg, #7c3aed, #8b5cf6);
            border: none;
            color: #ffffff;
            padding: 18px 40px;
            font-family: 'Play', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            margin-top: 30px;
            position: relative;
            clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .execute-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.6s;
        }

        .execute-btn:hover {
            background: linear-gradient(145deg, #8b5cf6, #a855f7);
            box-shadow: 
                0 0 30px rgba(139, 92, 246, 0.6),
                0 0 60px rgba(139, 92, 246, 0.3);
            transform: translateY(-2px);
        }

        .execute-btn:hover::before {
            left: 100%;
        }

        .execute-btn:active {
            transform: translateY(0);
        }

        /* Stats del modelo */
        .model-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 30px;
        }

        .stat-panel {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(139, 92, 246, 0.3);
            padding: 15px;
            text-align: center;
            clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
        }

        .stat-label {
            color: #9ca3af;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .stat-value {
            color: #8b5cf6;
            font-family: 'Play', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
        }

        /* Loading state */
        .execute-btn.loading {
            pointer-events: none;
            opacity: 0.8;
            background: linear-gradient(145deg, #6b7280, #9ca3af);
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .interface-content {
                padding: 25px;
            }

            .mission-title {
                font-size: 1.8rem;
            }

            .hud-status {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .form-row,
            .model-stats {
                grid-template-columns: 1fr;
            }

            .tactical-interface {
                clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
            }
        }

        /* Validación visual */
        .tactical-input:valid {
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }

        .tactical-input:invalid:not(:placeholder-shown) {
            border-color: #ff4444;
            box-shadow: 0 0 10px rgba(255, 68, 68, 0.3);
        }

        /* Efectos de entrada */
        .tactical-interface {
            animation: interface-boot 1s ease-out;
        }

        @keyframes interface-boot {
            0% {
                opacity: 0;
                transform: scale(0.9) translateY(30px);
                filter: blur(10px);
            }
            50% {
                opacity: 0.7;
                transform: scale(0.95) translateY(15px);
                filter: blur(5px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0);
            }
        }

        .input-group {
            animation: input-fade-in 0.6s ease-out forwards;
            opacity: 0;
        }

        .input-group:nth-child(1) { animation-delay: 0.1s; }
        .input-group:nth-child(2) { animation-delay: 0.2s; }
        .input-group:nth-child(3) { animation-delay: 0.3s; }
        .input-group:nth-child(4) { animation-delay: 0.4s; }
        .input-group:nth-child(5) { animation-delay: 0.5s; }
        .input-group:nth-child(6) { animation-delay: 0.6s; }

        @keyframes input-fade-in {
            0% {
                opacity: 0;
                transform: translateX(-20px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="tactical-interface">
            <!-- Esquinas HUD -->
            <div class="hud-corners corner-tl"></div>
            <div class="hud-corners corner-tr"></div>
            <div class="hud-corners corner-bl"></div>
            <div class="hud-corners corner-br"></div>

            <div class="interface-content">
                <!-- Header -->
                <div class="tactical-header">
                    <h1 class="mission-title">TACTICAL ANALYZER</h1>
                    <p class="mission-subtitle">Random Forest • Survival Prediction</p>
                </div>

                <!-- HUD Status -->
                <div class="hud-status">
                    <div class="status-item">
                        <span class="status-value">●</span>
                        <span>SISTEMA ACTIVO</span>
                    </div>
                    <div class="status-item">
                        <span class="status-critical">RF-200</span>
                        <span>ESTIMADORES</span>
                    </div>
                    <div class="status-item">
                        <span class="status-critical">99.95%</span>
                        <span>PRECISIÓN</span>
                    </div>
                </div>

                <!-- Formulario -->
                <form action="/resultado" method="post" id="tacticalForm" class="tactical-form">
                    <div class="input-group">
                        <label for="timeAlive" class="input-label">Tiempo de Supervivencia</label>
                        <input type="number" step="any" name="TimeAlive" id="timeAlive" 
                               class="tactical-input" required 
                               placeholder="Segundos en combate..." min="0">
                    </div>

                    <div class="form-row">
                        <div class="input-group">
                            <label for="travelledDistance" class="input-label">Distancia Recorrida</label>
                            <input type="number" step="any" name="TravelledDistance" id="travelledDistance" 
                                   class="tactical-input" required 
                                   placeholder="Unidades de movimiento..." min="0">
                        </div>

                        <div class="input-group">
                            <label for="firstKillTime" class="input-label">Primera Eliminación</label>
                            <input type="number" step="any" name="FirstKillTime" id="firstKillTime" 
                                   class="tactical-input" required 
                                   placeholder="Tiempo hasta primera baja..." min="0">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="input-group">
                            <label for="roundEquipment" class="input-label">Equipo Inicial</label>
                            <input type="number" step="any" name="RoundStartingEquipmentValue" 
                                   id="roundEquipment" class="tactical-input" required 
                                   placeholder="Valor del equipamiento..." min="0">
                        </div>

                        <div class="input-group">
                            <label for="teamEquipment" class="input-label">Equipo del Team</label>
                            <input type="number" step="any" name="TeamStartingEquipmentValue" 
                                   id="teamEquipment" class="tactical-input" required 
                                   placeholder="Valor total del equipo..." min="0">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="input-group">
                            <label for="killsPerMinute" class="input-label">Ritmo de Fuego</label>
                            <input type="number" step="any" name="Kills_por_minuto" id="killsPerMinute" 
                                   class="tactical-input" required 
                                   placeholder="Eliminaciones por minuto..." min="0">
                        </div>

                        <div class="input-group">
                            <label for="headshotRate" class="input-label">Precisión Letal</label>
                            <input type="number" step="any" name="Headshot_rate" id="headshotRate" 
                                   class="tactical-input" required 
                                   placeholder="Ratio headshots (0-1)..." min="0" max="1">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="input-group">
                            <label for="assistance" class="input-label">Apoyo Táctico</label>
                            <select name="Tuvo_asistencia" id="assistance" class="tactical-select" required>
                                <option value="" disabled selected>▶ Seleccionar estado...</option>
                                <option value="0">❌ Sin Apoyo</option>
                                <option value="1">✅ Con Apoyo</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <label for="totalEquipment" class="input-label">Arsenal Total</label>
                            <input type="number" step="any" name="Equipamiento_total" id="totalEquipment" 
                                   class="tactical-input" required 
                                   placeholder="Valor total del arsenal..." min="0">
                        </div>
                    </div>

                    <button type="submit" class="execute-btn" id="executeBtn">
                        <span>EJECUTAR ANÁLISIS</span>
                    </button>
                </form>

                <!-- Stats del modelo -->
                <div class="model-stats">
                    <div class="stat-panel">
                        <div class="stat-label">Algoritmo</div>
                        <div class="stat-value">Random Forest</div>
                    </div>
                    
                    <div class="stat-panel">
                        <div class="stat-label">R² Score</div>
                        <div class="stat-value">99.95%</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Form handling
        document.getElementById('tacticalForm').addEventListener('submit', function(e) {
            const executeBtn = document.getElementById('executeBtn');
            
            executeBtn.classList.add('loading');
            executeBtn.innerHTML = '<div class="loading-spinner"></div>ANALIZANDO...';
            
            // Simular procesamiento
            setTimeout(() => {
                // El formulario continuará normalmente
            }, 1500);
        });

        // Validación visual mejorada
        document.querySelectorAll('.tactical-input').forEach(input => {
            input.addEventListener('input', function() {
                const value = parseFloat(this.value);
                
                if (this.value === '') {
                    this.style.borderColor = 'rgba(139, 92, 246, 0.3)';
                    this.style.boxShadow = 'none';
                } else if (value < 0) {
                    this.style.borderColor = '#ff4444';
                    this.style.boxShadow = '0 0 15px rgba(255, 68, 68, 0.4)';
                } else {
                    this.style.borderColor = '#00ff88';
                    this.style.boxShadow = '0 0 15px rgba(0, 255, 136, 0.4)';
                }
            });

            input.addEventListener('focus', function() {
                this.style.transform = 'scale(1.02)';
            });
            
            input.addEventListener('blur', function() {
                this.style.transform = 'scale(1)';
            });
        });

        // Validación para select
        document.querySelectorAll('.tactical-select').forEach(select => {
            select.addEventListener('change', function() {
                if (this.value !== '') {
                    this.style.borderColor = '#00ff88';
                    this.style.boxShadow = '0 0 15px rgba(0, 255, 136, 0.4)';
                } else {
                    this.style.borderColor = '#ff4444';
                    this.style.boxShadow = '0 0 15px rgba(255, 68, 68, 0.4)';
                }
            });

            select.addEventListener('focus', function() {
                this.style.transform = 'scale(1.02)';
            });
            
            select.addEventListener('blur', function() {
                this.style.transform = 'scale(1)';
            });
        });

        // Dynamic precision counter
        let precision = 99.95;
        setInterval(() => {
            precision += (Math.random() - 0.5) * 0.01;
            precision = Math.max(99.90, Math.min(99.99, precision));
            
            document.querySelectorAll('.status-critical, .stat-value').forEach(el => {
                if (el.textContent.includes('%')) {
                    el.textContent = precision.toFixed(2) + '%';
                }
            });
        }, 3000);

        // Console boot sequence
        console.log(`
╔══════════════════════════════════════════════════════════════╗
║                  CS:GO TACTICAL ANALYZER                     ║
║                    Purple Strike Edition                     ║
╠══════════════════════════════════════════════════════════════╣
║                                                              ║
║  🎯 Sistema: Random Forest ML                                ║
║  📊 Precisión: 99.95%                                        ║
║  🔬 Variables: 9 características tácticas                    ║
║  💜 Estado: OPERACIONAL                                      ║
║                                                              ║
║  Iniciando análisis de supervivencia...                     ║
║                                                              ║
╚══════════════════════════════════════════════════════════════╝
        `);
    </script>
</body>
</html>
